services:
  # Backend Web Service (FREE TIER)
  - type: web
    name: huyenhoc
    runtime: node
    plan: free  # FREE TIER - sleeps after 15min inactive
    
    # Build configuration
    buildCommand: cd backendjs && npm install
    startCommand: cd backendjs && npm start
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: PORT
        value: 10000  # Render free tier uses port 10000
      - key: USE_SQLITE
        value: "true"  # Force SQLite — do NOT set DATABASE_URL
      - key: OPENROUTER_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: CORS_ORIGIN
        value: https://thuatso.onrender.com,http://localhost:3005
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true  # Auto-generate a secure JWT secret
    
    # Health check configuration
    healthCheckPath: /health
    healthCheckInterval: 30
    
    # Persistent disk for SQLite database (FREE 1GB)
    disk:
      name: bazi-sqlite-data
      mountPath: /opt/render/project/src/backendjs/data
      sizeGB: 1

  # Frontend Static Site (FREE)
  - type: static_site
    name: thuatso
    
    # Build configuration
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    
    # Environment variables
    envVars:
      - key: VITE_API_URL
        value: https://huyenhoc.onrender.com
      - key: VITE_APP_VERSION
        value: "2.1"
      - key: VITE_ENABLE_AI_CONSULTANT
        value: "true"
      - key: VITE_ENABLE_MATCHING
        value: "true"
      - key: VITE_ENABLE_ARTICLES
        value: "true"
      - key: VITE_ENABLE_ADMIN_PANEL
        value: "true"
    
    # Routes configuration for React SPA (prevents 404 on refresh)
    routes:
      - path: /*
        destination: /index.html
        type: rewrite
    
    # Headers for caching and security
    headers:
      - path: /
        headers:
          - key: Cache-Control
            value: public, max-age=3600
      - path: /assets/*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - path: /index.html
        headers:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate

# SQLite with persistent disk — no external database needed
